# Auditoría D.5: compara Earth Engine directo (tipo A) con la estimación local (tipo C).
name: Auditoría de paridad de procesamiento

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  paridad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Comparar procesamiento directo y local
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
        run: python scripts/auditoria/d_paridad.py
      - name: Guardar el resultado
        run: |
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditoria/datos/D_paridad.json
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -m "Auditoría de paridad de procesamiento"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
