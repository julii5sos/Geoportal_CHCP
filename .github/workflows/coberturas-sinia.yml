# Precalcula con Google Earth Engine los mapas y las superficies de los ocho productos
# SINIA–MiAMBIENTE (1992–2023) para la CHCP y sus 53 subcuencas, de modo que la página
# «Coberturas» del sitio publicado los muestre sin Earth Engine en vivo.
# Usa el mismo secreto que «Actualizar datos con Earth Engine» (GEE_SERVICE_ACCOUNT_JSON).
name: Coberturas SINIA (mapas y superficies)

on:
  workflow_dispatch:
    inputs:
      territorios:
        description: "Solo estos territorios, separados por comas (vacío = CHCP y las 53 subcuencas)"
        required: false
        default: ""
      productos:
        description: "Solo estos productos, p. ej. 2021_detallado,2012_detallado (vacío = los ocho)"
        required: false
        default: ""
      rehacer:
        description: "Recalcular aunque ya exista"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coberturas-sinia   # independiente de «actualizar-datos»: escriben archivos distintos
  cancel-in-progress: false

jobs:
  coberturas:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # el cálculo es reanudable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Comprobar que el secreto existe
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Falta el secreto GEE_SERVICE_ACCOUNT_JSON (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Precalcular mapas y superficies de los ocho productos
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
        run: |
          OPCIONES=""
          if [ -n "${{ github.event.inputs.territorios }}" ]; then OPCIONES="$OPCIONES --territorios ${{ github.event.inputs.territorios }}"; fi
          if [ -n "${{ github.event.inputs.productos }}" ]; then OPCIONES="$OPCIONES --productos ${{ github.event.inputs.productos }}"; fi
          if [ "${{ github.event.inputs.rehacer }}" = "true" ]; then OPCIONES="$OPCIONES --rehacer"; fi
          python scripts/precalcular_coberturas.py $OPCIONES
      - name: Comparar el bosque oficial 2021 y 2023 (sin Earth Engine)
        if: always()
        run: python scripts/comparar_bosque_2021_2023.py
      - name: Guardar resultados en el repositorio
        if: always()   # se guarda lo avanzado aunque falle o se agote el tiempo
        run: |
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -e data/coberturas ] && git add data/coberturas
          if git diff --cached --quiet; then
            echo "Sin cambios en las coberturas."
          else
            git commit -m "Precalcular coberturas SINIA ($(date -u +%Y-%m-%d))"
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 15
            done
          fi
