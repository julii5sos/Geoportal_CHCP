# Genera (una sola vez) la muestra estratificada para validar un mapa del geoportal.
# Después, la muestra se interpreta (página Validación, Google Earth Pro o QGIS) y el
# archivo data/validacion/<mapa>/muestra.csv se sube al repositorio: el sitio recalcula
# la exactitud y el área ajustada por error al publicarse.
name: Generar muestra de validación

on:
  workflow_dispatch:
    inputs:
      mapa:
        description: "Mapa a validar"
        type: choice
        options: [senal_perdida, hansen_2021_2025, jrc_cambio_2021_2025, sinia_2021]
        default: senal_perdida
      error_objetivo:
        description: "Error estándar objetivo de la exactitud global (0.015 ≈ ±3 %)"
        default: "0.015"
      minimo:
        description: "Puntos mínimos por estrato"
        default: "75"
      solo_imagenes:
        description: "Solo preparar las imágenes sin nubes de una muestra ya generada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: muestra-validacion   # solo escribe data/validacion: no espera a la actualización de datos
  cancel-in-progress: false

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Generar la muestra
        if: ${{ github.event.inputs.solo_imagenes != 'true' }}
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
        run: >
          python scripts/generar_muestra_validacion.py --mapa "${{ github.event.inputs.mapa }}"
          --error-objetivo "${{ github.event.inputs.error_objetivo }}" --minimo "${{ github.event.inputs.minimo }}"
      - name: Imágenes sin nubes y series por punto (Sentinel-2 y Sentinel-1)
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
          PYTHONUNBUFFERED: "1"
        run: python scripts/imagenes_validacion.py --mapa "${{ github.event.inputs.mapa }}"
      - name: Guardar la muestra en el repositorio
        if: always()
        run: |
          python scripts/evaluar_validacion.py
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validacion
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -m "Muestra de validación e imágenes: ${{ github.event.inputs.mapa }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
