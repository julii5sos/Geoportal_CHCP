# Precalcula con Google Earth Engine las series anuales de la CHCP y sus 53 subcuencas:
# JRC TMF 1990–2025, Hansen 2001–2025, ESRI 2017–2025 y NDVI 2017–2025 (mapas por año y
# superficies por clase), para la barra de años y las gráficas de la Plataforma SIG.
# Usa el mismo secreto que «Actualizar datos con Earth Engine» (GEE_SERVICE_ACCOUNT_JSON).
name: Series anuales (mapas y superficies por año)

on:
  workflow_dispatch:
    inputs:
      territorios:
        description: "Solo estos territorios, separados por comas (vacío = CHCP y las 53 subcuencas)"
        required: false
        default: ""
      productos:
        description: "Solo estos productos: jrc, hansen, esri, ndvi (vacío = los cuatro)"
        required: false
        default: ""
      rehacer:
        description: "Recalcular aunque ya exista"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: series-anuales   # independiente de los demás flujos: escribe solo data/series
  cancel-in-progress: false

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # el cálculo es reanudable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Comprobar que el secreto existe
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Falta el secreto GEE_SERVICE_ACCOUNT_JSON (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Precalcular mapas y superficies por año
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
          PYTHONUNBUFFERED: "1"
        run: |
          OPCIONES=""
          if [ -n "${{ github.event.inputs.territorios }}" ]; then OPCIONES="$OPCIONES --territorios ${{ github.event.inputs.territorios }}"; fi
          if [ -n "${{ github.event.inputs.productos }}" ]; then OPCIONES="$OPCIONES --productos ${{ github.event.inputs.productos }}"; fi
          if [ "${{ github.event.inputs.rehacer }}" = "true" ]; then OPCIONES="$OPCIONES --rehacer"; fi
          python scripts/precalcular_series.py $OPCIONES
      - name: Guardar resultados en el repositorio
        if: always()   # se guarda lo avanzado aunque falle o se agote el tiempo
        run: |
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -e data/series ] && git add data/series
          if git diff --cached --quiet; then
            echo "Sin cambios en las series."
          else
            git commit -m "Precalcular series anuales ($(date -u +%Y-%m-%d))"
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 15
            done
          fi
