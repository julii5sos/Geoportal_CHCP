# Auditoría B.4: comparación controlada del ráster SINIA 2012 con el servicio de MiAMBIENTE.
name: Auditoría SINIA 2012 controlada

on:
  workflow_dispatch:
    inputs:
      puntos:
        description: "Puntos interiores por código"
        default: "30"

permissions:
  contents: write

jobs:
  sinia2012:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Comparar códigos interiores con el servicio oficial
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
          PYTHONUNBUFFERED: "1"
        run: python scripts/auditoria/b_sinia_2012_controlado.py --puntos "${{ github.event.inputs.puntos }}"
      - name: Guardar el resultado
        run: |
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/auditoria/datos/B_comparacion_controlada_2012.json
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -m "Auditoría SINIA 2012: comparación controlada"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
