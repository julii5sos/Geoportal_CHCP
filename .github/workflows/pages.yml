# Publica la versión HTML estática del Geoportal CHCP en GitHub Pages.
# Activación (una vez): Settings → Pages → Build and deployment → Source: GitHub Actions.
# Opcional: Settings → Secrets and variables → Actions → Variables → CHCP_FULL_APP_URL
# con la dirección de la versión completa (Hugging Face) para enlazar el análisis.
name: Publicar sitio estático

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Actualizar datos con Earth Engine", "Generar muestra de validación", "Coberturas SINIA (mapas y superficies)", "Series anuales (mapas y superficies por año)", "Exactitud por fuente"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt pytest
      - run: python -m pytest -q
      - run: python scripts/evaluar_validacion.py
      - run: python scripts/construir_sitio_estatico.py --destino sitio --paquete-sin-conexion
        env:
          CHCP_FULL_APP_URL: ${{ vars.CHCP_FULL_APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
