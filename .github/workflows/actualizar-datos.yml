# Recalcula con Google Earth Engine los indicadores de la CHCP y sus 53 subcuencas
# y vuelve a publicar el sitio HTML. La clave de la cuenta de servicio se guarda
# como secreto cifrado del repositorio (GEE_SERVICE_ACCOUNT_JSON); nunca se escribe
# en el código, en los registros ni en la página publicada.
#
# Configuración (una vez): Settings → Secrets and variables → Actions → New repository
# secret → nombre GEE_SERVICE_ACCOUNT_JSON → pegar el contenido completo del archivo JSON.
name: Actualizar datos con Earth Engine

on:
  schedule:
    - cron: "17 6 1 * *"   # día 1 de cada mes, 01:17 en Panamá: recalcula todo con datos nuevos
    - cron: "17 6 2 * *"   # día 2: continúa con lo que no alcanzó el límite de 6 h de GitHub
  workflow_dispatch:
    inputs:
      limite:
        description: "Solo N territorios (vacío = todos)"
        required: false
        default: ""
      modo:
        description: "Qué recalcular"
        type: choice
        # completo: continúa donde quedó la ejecución anterior (los territorios de una versión de
        # datos anterior se recalculan solos). rehacer-todo: empieza de cero los 54 territorios.
        options: [completo, rehacer-todo, solo-mapas, sin-mapas]
        default: completo

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  recalcular:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # máximo de GitHub: 360; el cálculo es reanudable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Comprobar que el secreto existe
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Falta el secreto GEE_SERVICE_ACCOUNT_JSON (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Verificar Earth Engine con la cuenta de servicio
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
        run: python scripts/verificar_geoportal_gee.py --salida /tmp/verificacion.json
      - name: Recalcular indicadores de la CHCP y las 53 subcuencas
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
          PYTHONUNBUFFERED: "1"   # muestra el avance territorio por territorio mientras corre
        run: |
          OPCIONES=""
          if [ "${{ github.event.inputs.modo }}" = "solo-mapas" ]; then OPCIONES="--solo-mapas"; fi
          if [ "${{ github.event.inputs.modo }}" = "sin-mapas" ]; then OPCIONES="--sin-mapas"; fi
          if [ "${{ github.event.inputs.modo }}" = "rehacer-todo" ]; then OPCIONES="--rehacer"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" = "01" ]; then OPCIONES="--rehacer"; fi
          # Sin --rehacer el cálculo es reanudable: si se agota el tiempo de GitHub (6 h), se guarda
          # lo avanzado y la siguiente ejecución sigue con los territorios pendientes.
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            python scripts/precalcular_panel.py $OPCIONES --limite "${{ github.event.inputs.limite }}"
          else
            python scripts/precalcular_panel.py $OPCIONES
          fi
      - name: Guardar resultados en el repositorio
        if: always()   # el cálculo es reanudable: se guarda lo avanzado aunque falle o se agote el tiempo
        run: |
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ruta in data/estadisticas_territoriales.json data/registro_versiones.json data/subcuencas data/mapas; do [ -e "$ruta" ] && git add "$ruta"; done
          if git diff --cached --quiet; then
            echo "Sin cambios en los indicadores."
          else
            git commit -m "Actualizar indicadores con Earth Engine ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main   # por si main cambió durante el cálculo
            git push origin HEAD:main
          fi
