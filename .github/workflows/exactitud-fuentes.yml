# Exactitud de cada fuente de pérdida (JRC, Hansen, ESRI, NDVI) por separado, con la muestra de
# validación ya interpretada. Extrae con Earth Engine el valor de cada fuente en los 498 puntos
# (cálculo liviano, unos minutos) y calcula los estimadores de Stehman (2014).
name: Exactitud por fuente

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exactitud-fuentes
  cancel-in-progress: false

jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - run: pip install -r requirements-web.txt
      - name: Valor de cada fuente en los puntos y exactitud
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          GEE_PROJECT_ID: geoportal-513817
          PYTHONUNBUFFERED: "1"
        run: python scripts/exactitud_por_fuente.py --extraer
      - name: Guardar en el repositorio
        run: |
          git config user.name "geoportal-chcp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/validacion
          if git diff --cached --quiet; then echo "Sin cambios."; else
            git commit -m "Exactitud por fuente (Stehman 2014)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
