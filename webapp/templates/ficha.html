{% extends "base.html" %}
{% block title %}Ficha técnica por subcuenca · Geoportal CHCP{% endblock %}
{% block body %}
<main id="v-ficha" data-project="{{ project_id }}">
  <div class="fi-toolbar no-print">
    <label for="fi-select">Subcuenca</label>
    <select id="fi-select"></select>
    <button type="button" class="ayuda-btn" id="fi-ayuda">? Cómo leer la ficha</button>
    <div class="fi-descarga">
      <button class="btn btn-p" id="fi-print" type="button" aria-expanded="false" aria-controls="fi-descarga-m">Descargar PDF</button>
      <div class="fi-descarga-m" id="fi-descarga-m" hidden>
        <button type="button" data-pdf="resumen"><b>Resumen</b><small>2 hojas: diagnóstico, mapas y qué hacer</small></button>
        <button type="button" data-pdf="completa"><b>Ficha completa</b><small>Todos los análisis y mapas</small></button>
        <p>Se abre el cuadro de impresión: elija «Guardar como PDF».</p>
        <button type="button" data-geo><b>Límite en GeoJSON</b><small>Para abrirlo en QGIS o Global Forest Watch</small></button>
      </div>
    </div>
    <a class="btn btn-s" id="fi-sim" href="{% if sitio_estatico %}restauracion.html{% else %}{{ url_for('restauracion') }}{% endif %}">Simular restauración</a>
    <a class="btn btn-s" id="fi-back" href="{{ url_for('panel') }}">Volver al panel</a>
  </div>
  <article class="fi-doc" id="fi-doc" aria-live="polite">
    <p class="fi-loading">Cargando ficha técnica…</p>
  </article>
  <div class="fi-res" id="fi-resumen" hidden></div>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/red_conectividad.js') }}"></script><script src="{{ url_for('static', filename='js/ficha.js') }}"></script>{% endblock %}
